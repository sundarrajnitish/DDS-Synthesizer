name: formal verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install GHDL, Yosys and the Python solvers
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl yosys
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Lint (VHDL-93 and VHDL-2008)
        run: make lint PY=python
      - name: Formal flow (equivalence, repair, induction, mutants, theorems)
        run: make quick PY=python
      - name: Simulation (RTL, lean, golden, fixed must pass; buggy must fail)
        run: make sim PY=python
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports
            netlists/fixed
